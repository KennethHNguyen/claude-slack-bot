# Slack app manifest template for the Claude Code DM bot.
# Don't paste this file directly - run ./make-manifest.sh, which fills in your name and
# copies the finished manifest to your clipboard.
#
# Scopes are deliberately minimal (bot token only, no user token, no incoming webhooks):
#   im:history  - read the DMs you send to the bot
#   chat:write  - reply, update its own progress messages, delete its own messages
# Socket Mode uses an app-level token with connections:write (created separately).
display_information:
  name: Claude Code - __FIRST__
  description: Personal DM bot that relays my prompts to Claude Code on my Mac. DM-only, responds only to me.
  background_color: "#1f1f1f"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: claude-code-__HANDLE__
    always_online: false
oauth_config:
  scopes:
    bot:
      - im:history
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
